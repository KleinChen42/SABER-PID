[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-reliability-benchmark"
version = "0.1.0"
description = "Result-driven reliability experiments for P&ID vision-language models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.3",
  "pillow==11.1.0",
  "matplotlib==3.10.0",
  "PyMuPDF==1.27.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[project.scripts]
pidbench = "pidbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
