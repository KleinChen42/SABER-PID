[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-reliability-benchmark"
version = "0.1.0"
description = "Result-driven reliability experiments for P&ID vision-language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pidbench = "pidbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
